# UniFi Network controller + its MongoDB database, on the EliteDesk (goodmedia).
# Live copy: ~/unifi/docker-compose.yml. Passwords are NOT stored here:
# they come from ~/unifi/.env (chmod 600, never committed). See .env.example.
services:
  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
    volumes:
      - /srv/unifi/db:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    restart: unless-stopped

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-network-application
    depends_on:
      - unifi-db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
      - MEM_LIMIT=1024
      - MEM_STARTUP=1024
    volumes:
      - /srv/unifi/config:/config
    ports:
      - 8443:8443        # web page
      - 8080:8080        # device inform (switch reports here)
      - 3478:3478/udp    # STUN
      - 10001:10001/udp  # device discovery
      - 8843:8843
      - 8880:8880
      - 6789:6789
    restart: unless-stopped
